<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدقق المتابعين</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root{
    color-scheme:light dark;
    --bg:#F1EEF6;
    --surface:#FFFFFF;
    --surface-2:#EAE5F4;
    --ink:#231F35;
    --ink-dim:#5B5570;
    --border:#DDD6EC;
    --accent:#4B3F8F;
    --accent-ink:#FFFFFF;
    --accent-soft:#EBE7F9;
    --good:#1F9D6B;
    --good-soft:#DFF3EA;
    --warn:#C9821E;
    --warn-soft:#F8EAD3;
    --bad:#D14444;
    --bad-soft:#FBE4E4;
    --shadow: 0 1px 2px rgba(35,31,53,.04), 0 8px 24px -12px rgba(35,31,53,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171426;
      --surface:#211D33;
      --surface-2:#2A2542;
      --ink:#EDEAF7;
      --ink-dim:#B2AACC;
      --border:#3A3455;
      --accent:#9086E3;
      --accent-ink:#171426;
      --accent-soft:#2C2748;
      --good:#3FCB8E;
      --good-soft:#1C3A30;
      --warn:#E8B45B;
      --warn-soft:#3B2F1B;
      --bad:#F17878;
      --bad-soft:#3B2226;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171426;
    --surface:#211D33;
    --surface-2:#2A2542;
    --ink:#EDEAF7;
    --ink-dim:#B2AACC;
    --border:#3A3455;
    --accent:#9086E3;
    --accent-ink:#171426;
    --accent-soft:#2C2748;
    --good:#3FCB8E;
    --good-soft:#1C3A30;
    --warn:#E8B45B;
    --warn-soft:#3B2F1B;
    --bad:#F17878;
    --bad-soft:#3B2226;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); font:14px system-ui,sans-serif; color:var(--ink);}
  .page{
    direction:rtl;
    font-family:'IBM Plex Sans Arabic', 'Cairo', system-ui, sans-serif;
    color:var(--ink);
    max-width:640px;
    margin:0 auto;
    padding:28px 18px 48px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  h1,h2,h3{font-family:'Cairo','IBM Plex Sans Arabic',sans-serif; margin:0; text-wrap:balance;}
  .mono{font-family:'Space Grotesk','IBM Plex Sans Arabic',sans-serif; font-variant-numeric:tabular-nums;}

  .masthead{display:flex; align-items:center; gap:12px;}
  .mast-icon{
    width:44px;height:44px;border-radius:12px;flex:none;
    background:var(--accent-soft); color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .masthead h1{font-size:20px; font-weight:800; color:var(--ink);}
  .tagline{margin:2px 0 0; font-size:13px; color:var(--ink-dim);}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:20px;
  }

  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .panel-head h2{font-size:16px; font-weight:700;}
  .ghost-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border:1px solid transparent; border-radius:10px;
    padding:7px 12px; cursor:pointer;
  }
  .ghost-btn:hover{filter:brightness(0.96);}
  .primary-btn{
    font-family:inherit; font-size:14px; font-weight:700; color:var(--accent-ink);
    background:var(--accent); border:none; border-radius:12px;
    padding:11px 16px; cursor:pointer; width:100%;
  }
  .primary-btn:hover{filter:brightness(1.06);}
  .primary-btn:disabled{opacity:.6; cursor:progress;}
  .ghost-btn:focus-visible, .primary-btn:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .field-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:14px;}
  .field-grid label{
    display:flex; flex-direction:column; gap:5px;
    font-size:12.5px; color:var(--ink-dim); font-weight:600;
  }
  .field-grid input[type="text"], .field-grid input[type="url"]{
    font-family:'Space Grotesk','IBM Plex Sans Arabic',sans-serif;
    font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 10px; width:100%;
  }
  .field-grid input[dir="ltr"]{text-align:left;}
  .form-actions{margin-top:16px; display:flex; flex-direction:column; gap:10px;}
  .msg{margin:0; font-size:12.5px; line-height:1.7; color:var(--bad);}
  .msg[hidden]{display:none;}

  .profile-row{display:flex; align-items:center; gap:12px;}
  .avatar{
    position:relative; overflow:hidden;
    width:56px; height:56px; border-radius:50%; flex:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-soft));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; font-size:20px;
  }
  .avatar img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; background:var(--surface-2);
  }
  .avatar img[hidden]{display:none;}
  .profile-meta{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0;}
  .handle{font-weight:700; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:right;}
  .followers-line{font-size:12.5px; color:var(--ink-dim);}
  .badge{
    flex:none; font-size:12.5px; font-weight:700; padding:5px 12px; border-radius:999px;
  }
  .badge-good{background:var(--good-soft); color:var(--good);}
  .badge-warn{background:var(--warn-soft); color:var(--warn);}
  .badge-bad{background:var(--bad-soft); color:var(--bad);}

  .score-hero{
    display:flex; align-items:center; gap:22px; margin-top:22px; flex-wrap:wrap;
  }
  .ring-wrap{position:relative; width:128px; height:128px; flex:none;}
  .ring{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--border); stroke-width:10;}
  .ring-progress{
    fill:none; stroke-width:10; stroke-linecap:round; stroke:var(--good);
    stroke-dasharray:326.7256; stroke-dashoffset:326.7256;
    transition:stroke-dashoffset .5s ease, stroke .3s ease;
  }
  .ring-progress.band-warn{stroke:var(--warn);}
  .ring-progress.band-bad{stroke:var(--bad);}
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px;
  }
  .ring-score{font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:700; line-height:1;}
  .ring-label{font-size:11px; color:var(--ink-dim); font-weight:600;}

  .breakdown{flex:1; min-width:200px; display:flex; flex-direction:column; gap:12px;}
  .breakdown-bar{
    display:flex; height:12px; width:100%; border-radius:999px; overflow:hidden;
    background:var(--surface-2);
  }
  .seg{height:100%; transition:width .5s ease;}
  .seg-good{background:var(--good);}
  .seg-warn{background:var(--warn);}
  .seg-bad{background:var(--bad);}
  .legend{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .legend li{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-dim);}
  .legend b{margin-inline-start:auto; font-family:'Space Grotesk',sans-serif; color:var(--ink); font-size:14px;}
  .dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .dot-good{background:var(--good);}
  .dot-warn{background:var(--warn);}
  .dot-bad{background:var(--bad);}

  .report-note{
    margin:20px 0 0; padding:12px 14px; font-size:12.5px; line-height:1.7; color:var(--ink-dim);
    background:var(--surface-2); border-radius:12px; border:1px solid var(--border);
  }

  .stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:22px;}
  .stats[hidden]{display:none;}
  .stat{
    background:var(--surface-2); border-radius:14px; padding:14px 6px;
    display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; text-align:center;
  }
  .stat b{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; line-height:1.2;}
  .stat span{font-size:12px; color:var(--ink-dim);}

  .signals{margin-top:26px;}
  .signals[hidden]{display:none;}
  .signals h3{font-size:14.5px; font-weight:700; margin-bottom:4px;}
  .sig-list{list-style:none; margin:0; padding:0;}
  .sig{display:flex; align-items:center; gap:14px; padding:13px 0; border-top:1px solid var(--border);}
  .sig-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .sig-label{font-size:13.5px; font-weight:700;}
  .sig-detail{font-size:12px; color:var(--ink-dim); line-height:1.6;}
  .sig-meter{display:flex; align-items:center; gap:10px; flex:none; direction:ltr;}
  .sig-score{font-size:14px; font-weight:600; min-width:24px; text-align:right;}
  .sig-track{width:96px; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; direction:rtl;}
  .sig-fill{height:100%; border-radius:999px; transition:width .5s ease;}
  .sig-fill.band-good{background:var(--good);}
  .sig-fill.band-warn{background:var(--warn);}
  .sig-fill.band-bad{background:var(--bad);}

  @media (max-width:420px){
    .score-hero{justify-content:center;}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
    .sig-track{width:72px;}
  }
</style>
</head>
<body>

<div class="page" dir="rtl" lang="ar">

  <header class="masthead">
    <div class="mast-icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5v6c0 5 3.4 8.7 8 9 4.6-.3 8-4 8-9V5l-8-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>مدقق المتابعين</h1>
      <p class="tagline">تقدير جودة متابعين حساب إنستغرام</p>
    </div>
  </header>

  <section class="panel input-panel">
    <div class="panel-head">
      <h2>بيانات الحساب</h2>
      <button id="btnExample" type="button" class="ghost-btn">تحميل مثال</button>
    </div>

    <form id="checkForm" novalidate>
      <div class="field-grid">
        <label for="inpLink">رابط الحساب
          <input id="inpLink" type="url" dir="ltr" inputmode="url" autocomplete="off" placeholder="https://www.instagram.com/username/" />
        </label>
      </div>
      <div class="form-actions">
        <button id="btnCheck" type="submit" class="primary-btn">تحليل الحساب</button>
        <p id="errMsg" class="msg" role="alert" hidden></p>
      </div>
    </form>
  </section>

  <section class="panel report-panel">
    <div class="profile-row">
      <div class="avatar"><span id="avatarInitial">؟</span><img id="avatarImg" alt="" referrerpolicy="no-referrer" hidden></div>
      <div class="profile-meta">
        <span class="handle" id="outHandle">—</span>
        <span class="followers-line"><span id="outFollowersLine" class="mono">—</span> متابع</span>
      </div>
      <span class="badge badge-good" id="outBadge" hidden></span>
    </div>

    <div class="score-hero">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="ring-track"/>
          <circle cx="60" cy="60" r="52" class="ring-progress" id="ringProgress"/>
        </svg>
        <div class="ring-center">
          <span class="ring-score mono" id="outScore">—</span>
          <span class="ring-label">درجة الجودة</span>
        </div>
      </div>
      <div class="breakdown">
        <div class="breakdown-bar">
          <div class="seg seg-good" id="segReal" style="width:0%"></div>
          <div class="seg seg-warn" id="segSus" style="width:0%"></div>
          <div class="seg seg-bad" id="segBot" style="width:0%"></div>
        </div>
        <ul class="legend">
          <li><span class="dot dot-good"></span> حقيقي <b id="outReal" class="mono">—</b></li>
          <li><span class="dot dot-warn"></span> مشبوه <b id="outSus" class="mono">—</b></li>
          <li><span class="dot dot-bad"></span> بوت / مزيف <b id="outBot" class="mono">—</b></li>
        </ul>
      </div>
    </div>

    <div class="stats" id="stats" hidden>
      <div class="stat"><b id="statFollowers" class="mono">—</b><span>متابعون</span></div>
      <div class="stat"><b id="statLikes" class="mono">—</b><span>متوسط الإعجابات</span></div>
      <div class="stat"><b id="statComments" class="mono">—</b><span>متوسط التعليقات</span></div>
      <div class="stat"><b id="statEr" class="mono">—</b><span>ER</span></div>
    </div>

    <div class="signals" id="signals" hidden>
      <h3>تفصيل المؤشرات</h3>
      <ul class="sig-list" id="sigList"></ul>
    </div>

    <p class="report-note" id="reportNote">أدخل رابط حساب إنستغرام احترافي (Business أو Creator) واضغط «تحليل الحساب».</p>
  </section>
</div>

<script>
(function(){
  "use strict";

  var EXAMPLE_LINK = "https://www.instagram.com/instagram/";
  var RESERVED = ["p","reel","reels","tv","stories","explore","accounts","direct"];

  var ERRORS = {
    invalid_handle: "أدخل رابط حساب إنستغرام صالحًا، مثل instagram.com/username",
    not_professional_or_not_found: "لم نعثر على الحساب. المدعوم حسابات Business وCreator فقط، وليس الحسابات الشخصية أو المقيّدة بالعمر.",
    rate_limited: "تجاوزنا الحد المسموح مؤقتًا. حاول بعد قليل.",
    not_configured: "الخدمة غير مهيّأة بعد: يلزم ضبط رمز الوصول على الخادم.",
    no_instagram_account: "رمز الوصول على الخادم غير مرتبط بحساب إنستغرام احترافي.",
    token_invalid: "انتهت صلاحية رمز الوصول على الخادم. يلزم تجديده.",
    upstream_error: "تعذّر جلب البيانات من إنستغرام. حاول مرة أخرى.",
    network: "تعذّر الاتصال بالخادم. تحقّق من الاتصال وحاول مرة أخرى."
  };

  function byId(id){ return document.getElementById(id); }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function fmt(n){
    try { return Number(n).toLocaleString('en-US', {maximumFractionDigits:1}); }
    catch(e){ return String(n); }
  }

  function parseHandle(value){
    var v = (value || "").trim();
    if (!v) return "";
    var m = v.match(/instagram\.com\/([A-Za-z0-9._]+)/i);
    if (m) return RESERVED.indexOf(m[1].toLowerCase()) === -1 ? m[1] : "";
    v = v.replace(/^@/, "");
    return /^[A-Za-z0-9._]{1,30}$/.test(v) ? v : "";
  }

  /* ---------- التقدير الحسابي من الأرقام المُجلبة ---------- */
  function getTier(followers){
    if (followers < 5000) return 8;
    if (followers < 100000) return 4;
    if (followers < 500000) return 2.5;
    if (followers < 1000000) return 1.5;
    return 1;
  }
  function tierName(t){
    if (t >= 8) return "نانو";
    if (t >= 4) return "مايكرو";
    if (t >= 2.5) return "متوسط";
    if (t >= 1.5) return "كبير";
    return "ميغا";
  }
  function commentLikeScore(clr){
    if (clr <= 0) return 20;
    return clamp(Math.round(100 - Math.abs(clr - 3.5) * 12), 15, 100);
  }
  function followRatioScore(r){
    if (r >= 10) return 95;
    if (r >= 2) return Math.round(60 + (r - 2) / 8 * 35);
    if (r >= 0.5) return Math.round(30 + (r - 0.5) / 1.5 * 30);
    return 20;
  }
  function band(score){
    if (score >= 70) return "good";
    if (score >= 50) return "warn";
    return "bad";
  }

  function estimate(d){
    var er = d.followers > 0 ? (d.avgLikes + d.avgComments) / d.followers * 100 : 0;
    var tier = getTier(d.followers);
    var clr = d.avgLikes > 0 ? d.avgComments / d.avgLikes * 100 : 0;
    var profileCount = (d.profilePicture ? 1 : 0) + (d.name ? 1 : 0) + (d.hasBio ? 1 : 0) +
                       (d.hasWebsite ? 1 : 0) + (d.mediaCount > 0 ? 1 : 0);

    var signals = [];
    signals.push({
      label: "صحة المشاركة",
      detail: "ER " + er.toFixed(2) + "% · " + tier + "% (" + tierName(tier) + ") متوقع",
      score: clamp(Math.round(er / tier * 100), 0, 100), w: 0.28
    });
    if (typeof d.following === "number"){
      signals.push({
        label: "نسبة المتابِعين/المتابَعين",
        detail: fmt(d.followers) + " متابع · " + fmt(d.following) + " متابَع",
        score: followRatioScore(d.followers / Math.max(d.following, 1)), w: 0.12
      });
    }
    signals.push({
      label: "نسبة التعليق إلى الإعجاب",
      detail: clr.toFixed(1) + " تعليق لكل 100 إعجاب",
      score: commentLikeScore(clr), w: 0.20
    });
    signals.push({
      label: "نشاط النشر",
      detail: fmt(d.mediaCount) + " منشور إجمالاً",
      score: clamp(Math.round(d.mediaCount / 300 * 100), 0, 100), w: 0.15
    });
    if (typeof d.likesCv === "number"){
      signals.push({
        label: "اتساق الأداء",
        detail: "تباين الإعجابات بين آخر " + d.sampleSize + " منشورًا: " + Math.round(d.likesCv * 100) + "%",
        score: clamp(Math.round(100 - d.likesCv * 60), 20, 100), w: 0.15
      });
    }
    signals.push({
      label: "اكتمال الملف الشخصي",
      detail: profileCount + " من 5 عناصر مكتملة",
      score: profileCount * 20, w: 0.10
    });

    var sum = 0, wsum = 0;
    for (var i = 0; i < signals.length; i++){ sum += signals[i].score * signals[i].w; wsum += signals[i].w; }
    var quality = clamp(Math.round(sum / wsum), 0, 100);
    var risk = 100 - quality;
    var bot = clamp(Math.round(risk * 0.42), 0, 100);
    var sus = clamp(Math.round(risk * 0.33), 0, 100);
    return { quality: quality, bot: bot, sus: sus, real: clamp(100 - bot - sus, 0, 100), er: er, signals: signals };
  }

  /* ---------- العرض ---------- */
  function setError(text){
    var el = byId('errMsg');
    el.textContent = text || "";
    el.hidden = !text;
  }

  function make(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function setAvatar(url, initial){
    var img = byId('avatarImg');
    byId('avatarInitial').textContent = initial;
    img.hidden = true;
    img.removeAttribute('src');
    if (!url || url.indexOf("https://") !== 0) return;
    img.onload = function(){ img.hidden = false; };
    img.onerror = function(){ img.hidden = true; };
    img.src = url;
  }

  function resetReport(note){
    byId('outHandle').textContent = "—";
    setAvatar(null, "؟");
    byId('outFollowersLine').textContent = "—";
    byId('outBadge').hidden = true;
    byId('outScore').textContent = "—";
    var ring = byId('ringProgress');
    ring.style.strokeDashoffset = 326.7256;
    ring.classList.remove('band-warn','band-bad');
    byId('segReal').style.width = "0%";
    byId('segSus').style.width = "0%";
    byId('segBot').style.width = "0%";
    byId('outReal').textContent = "—";
    byId('outSus').textContent = "—";
    byId('outBot').textContent = "—";
    byId('stats').hidden = true;
    byId('signals').hidden = true;
    byId('sigList').textContent = "";
    byId('reportNote').textContent = note || "أدخل رابط حساب إنستغرام احترافي (Business أو Creator) واضغط «تحليل الحساب».";
  }

  function renderSignals(list){
    var ul = byId('sigList');
    ul.textContent = "";
    for (var i = 0; i < list.length; i++){
      var s = list[i];
      var li = make('li', 'sig');
      var text = make('div', 'sig-text');
      text.appendChild(make('span', 'sig-label', s.label));
      text.appendChild(make('span', 'sig-detail', s.detail));
      var meter = make('div', 'sig-meter');
      meter.appendChild(make('span', 'sig-score mono', String(s.score)));
      var track = make('div', 'sig-track');
      var fill = make('div', 'sig-fill band-' + band(s.score));
      fill.style.width = s.score + "%";
      track.appendChild(fill);
      meter.appendChild(track);
      li.appendChild(text);
      li.appendChild(meter);
      ul.appendChild(li);
    }
    byId('signals').hidden = false;
  }

  function renderResult(d){
    byId('outHandle').textContent = "@" + d.handle;
    setAvatar(d.profilePicture, (d.handle.charAt(0) || "؟").toUpperCase());
    byId('outFollowersLine').textContent = fmt(d.followers);

    if (d.avgLikes === null || d.avgComments === null || d.sampleSize === 0){
      byId('outBadge').hidden = true;
      byId('reportNote').textContent = "لا تتوفر أرقام الإعجابات أو التعليقات لهذا الحساب، لذلك لا يمكن تقدير الجودة.";
      return;
    }

    var e = estimate(d);
    var label, cls;
    if (e.quality >= 85) { label = "ممتاز"; cls = "badge-good"; }
    else if (e.quality >= 70) { label = "جيد"; cls = "badge-good"; }
    else if (e.quality >= 50) { label = "متوسط"; cls = "badge-warn"; }
    else { label = "ضعيف"; cls = "badge-bad"; }
    var badge = byId('outBadge');
    badge.textContent = label;
    badge.className = "badge " + cls;
    badge.hidden = false;

    byId('outScore').textContent = e.quality;
    var ring = byId('ringProgress');
    ring.classList.remove('band-warn','band-bad');
    var b = band(e.quality);
    if (b === 'warn') ring.classList.add('band-warn');
    if (b === 'bad') ring.classList.add('band-bad');
    ring.style.strokeDashoffset = 326.7256 * (1 - e.quality / 100);

    byId('segReal').style.width = e.real + "%";
    byId('segSus').style.width = e.sus + "%";
    byId('segBot').style.width = e.bot + "%";
    byId('outReal').textContent = e.real + "%";
    byId('outSus').textContent = e.sus + "%";
    byId('outBot').textContent = e.bot + "%";

    byId('statFollowers').textContent = fmt(d.followers);
    byId('statLikes').textContent = fmt(d.avgLikes);
    byId('statComments').textContent = fmt(d.avgComments);
    byId('statEr').textContent = e.er.toFixed(2) + "%";
    byId('stats').hidden = false;

    renderSignals(e.signals);

    byId('reportNote').textContent = "تقدير حسابي مبني على آخر " + d.sampleSize + " منشورًا وعدد المنشورات الكلي، وليس فحصًا لقائمة المتابعين نفسها.";
  }

  /* ---------- الطلب ---------- */
  var busy = false;

  function analyze(){
    if (busy) return;
    var handle = parseHandle(byId('inpLink').value);
    setError("");
    if (!handle){
      resetReport();
      setError(ERRORS.invalid_handle);
      return;
    }

    busy = true;
    var btn = byId('btnCheck');
    btn.disabled = true;
    btn.textContent = "جارٍ التحليل…";
    resetReport("جارٍ جلب بيانات الحساب…");

    fetch("/api/instagram?handle=" + encodeURIComponent(handle), { headers: { "Accept": "application/json" } })
      .then(function(r){
        return r.json().then(function(j){ return { ok: r.ok, body: j }; }, function(){ return { ok: false, body: {} }; });
      })
      .then(function(res){
        if (!res.ok){
          resetReport();
          setError(ERRORS[res.body && res.body.error] || ERRORS.upstream_error);
          return;
        }
        renderResult(res.body);
      })
      .catch(function(){
        resetReport();
        setError(ERRORS.network);
      })
      .then(function(){
        busy = false;
        btn.disabled = false;
        btn.textContent = "تحليل الحساب";
      });
  }

  byId('checkForm').addEventListener('submit', function(e){
    e.preventDefault();
    analyze();
  });
  byId('btnExample').addEventListener('click', function(){
    byId('inpLink').value = EXAMPLE_LINK;
    analyze();
  });
  byId('inpLink').addEventListener('input', function(){
    if (busy) return;
    setError("");
    resetReport();
  });

  resetReport();
})();
</script>
</body>
</html>
